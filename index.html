<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiBK SMP - Milik Anedebora</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>.inp{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.45rem .6rem;margin-top:.2rem;background:#fff}
.btn{background:#4f46e5;color:#fff;border-radius:.5rem;padding:.45rem .9rem;font-size:.875rem}.btn:hover{background:#4338ca}
.btn2{background:#e2e8f0;border-radius:.5rem;padding:.45rem .9rem;font-size:.875rem}
.card{background:#fff;border-radius:1rem;box-shadow:0 1px 3px #0001;padding:1rem}
th{text-align:left;padding:.5rem;background:#f1f5f9;font-size:.75rem;text-transform:uppercase;color:#475569}td{padding:.5rem;border-top:1px solid #e2e8f0;font-size:.875rem}html.dark{color-scheme:dark}html.dark body.bg-slate-100{background:#0f172a;color:#e2e8f0}
html.dark .card,html.dark #mb{background:#1e293b;color:#e2e8f0}html.dark .inp{background:#0f172a;color:#e2e8f0;border-color:#475569}
html.dark th{background:#334155;color:#cbd5e1}html.dark td{border-color:#334155}html.dark .btn2{background:#334155;color:#e2e8f0}
html.dark .bg-slate-100{background:#334155}html.dark .text-slate-500,html.dark .text-slate-400{color:#94a3b8}html.dark .text-indigo-600{color:#a5b4fc}
html.dark .border-indigo-300{border-color:#6366f1}html.dark{transition:background .2s}</style>
<script>try{var t=localStorage.getItem('sibk_theme');if(t=='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(x){}</script></head>
<body class="bg-slate-100 text-slate-800">
<div id="toast" class="fixed top-4 right-4 z-[60] space-y-2"></div>
<aside id="sb" class="fixed inset-y-0 left-0 w-60 bg-indigo-900 text-white p-4 z-40 -translate-x-full md:translate-x-0 transition">
<div class="font-bold text-xl mb-1">🧭 SiBK SMP</div><div class="text-xs text-indigo-200 mb-3">Bimbingan Konseling</div><div class="bg-indigo-800 rounded-xl p-3 mb-4 text-xs"><div class="text-indigo-300">Pemilik Aplikasi</div><div class="font-bold text-sm">👤 Anedebora</div></div><nav id="nav" class="space-y-1"></nav><button id="tbtn" onclick="tema()" class="absolute bottom-4 left-4 right-4 bg-indigo-800 hover:bg-indigo-700 rounded-lg py-2 text-sm"></button></aside>
<div class="md:ml-60"><header class="md:hidden bg-indigo-900 text-white p-3 flex items-center gap-3"><button onclick="sb.classList.toggle('-translate-x-full')" class="text-2xl">☰</button><b class="flex-1">SiBK SMP</b><button onclick="tema()" class="tbtn2 text-xl"></button></header>
<main id="main" class="p-4 md:p-6"></main><footer class="text-center text-xs text-slate-500 pb-6">© 2026 SiBK SMP • Dibuat khusus untuk <b>Anedebora</b> 💙</footer></div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto"><div id="mb" class="bg-white rounded-2xl p-5 w-full max-w-2xl mt-6"></div></div>
<script>
const OWNER='Anedebora',K='sibk_v1',$=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,9);
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){const kelas=['7A','7B','8A','8B','9A','9B'];
const D=[['2401','Andi Pratama','7A','L','Budi Pratama'],['2402','Siti Nurhaliza','7A','P','Hasan Basri'],['2403','Rizky Maulana','7B','L','Agus Salim'],['2404','Dewi Lestari','7B','P','Yuli Astuti'],['2405','Fajar Nugroho','8A','L','Slamet Riyadi'],['2406','Putri Ayu','8A','P','Dedi Kurnia'],['2407','Bayu Setiawan','8B','L','Joko Susilo'],['2408','Nadia Rahmawati','9A','P','Rahmat Hidayat'],['2409','Kevin Wijaya','9A','L','Hendra Wijaya'],['2410','Salsabila Putri','9B','P','Ahmad Fauzi']];
const siswa=D.map((d,i)=>({id:'s'+i,nis:d[0],nama:d[1],kelas:d[2],jk:d[3],ortu:d[4],hp:'08121000'+String(i+1).padStart(4,'0'),cat:i==2?'Perlu pendampingan perilaku':''}));
const absensi=[];siswa.forEach((s,i)=>{for(let d=0;d<5;d++){const r=(i*3+d)%10;absensi.push({id:uid(),sid:s.id,tgl:ago(d),status:r==0?'Alfa':r==1?'Sakit':r==2?'Terlambat':r==3?'Izin':'Hadir',ket:''})}});
const aturan=[['a1','Terlambat',-5],['a2','Atribut tidak lengkap',-5],['a3','Bolos',-15],['a4','Berkelahi',-30],['a5','Prestasi Akademik',20],['a6','Membantu teman / perilaku positif',10]].map(a=>({id:a[0],nama:a[1],poin:a[2]}));
const P=[[0,'a1',2],[2,'a3',5],[2,'a4',8],[2,'a3',20],[4,'a1',3],[6,'a2',35],[1,'a5',4],[7,'a6',10],[9,'a5',40],[8,'a1',1],[3,'a2',50]];
const poin=P.map(p=>{const a=aturan.find(x=>x.id==p[1]);return{id:uid(),sid:'s'+p[0],tgl:ago(p[2]),aid:a.id,kategori:a.nama,poin:a.poin,desc:a.poin<0?'Pelanggaran tercatat oleh guru piket':'Capaian positif siswa',tl:a.poin<0?'Pembinaan lisan':'Apresiasi di kelas'}});
const konseling=[{id:uid(),sid:'s2',tgl:ago(6),jenis:'Konseling Individu',masalah:'Sering bolos dan berkelahi',hasil:'Siswa mengaku ada masalah dengan teman sebangku',rtl:'Konseling lanjutan & komunikasi dengan orang tua',status:'Proses'},{id:uid(),sid:'s4',tgl:ago(9),jenis:'Catatan Anekdot',masalah:'Sering melamun saat pelajaran',hasil:'Perlu observasi lanjutan',rtl:'Pantau 2 minggu',status:'Proses'},{id:uid(),sid:'s7',tgl:ago(15),jenis:'Konseling Karir',masalah:'Bingung memilih SMA/SMK',hasil:'Diarahkan sesuai minat teknologi',rtl:'Kunjungan info sekolah lanjutan',status:'Selesai'},{id:uid(),sid:'s2',tgl:ago(3),jenis:'Home Visit',masalah:'Orang tua belum merespons panggilan',hasil:'Orang tua kooperatif',rtl:'Pantau perkembangan 1 bulan',status:'Proses'}];
const asesmen=[{id:uid(),sid:'s1',tgl:ago(12),gaya:'Visual',minat:'Seni/Musikal'},{id:uid(),sid:'s8',tgl:ago(11),gaya:'Kinestetik',minat:'Teknologi'}];
return{kelas,siswa,absensi,aturan,poin,konseling,asesmen}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}if(!S||!S.siswa)S=seed();
const persist=()=>localStorage.setItem(K,JSON.stringify(S));persist();
const toast=(m,t='ok')=>{const d=document.createElement('div');d.className='px-4 py-3 rounded-xl shadow-lg text-white text-sm '+(t=='ok'?'bg-emerald-600':'bg-rose-600');d.textContent=(t=='ok'?'✓ ':'⚠ ')+m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2800)};
const sel=(n,o,v,x='')=>`<select name="${n}" class="inp" ${x}>${o.map(i=>{const[a,b]=Array.isArray(i)?i:[i,i];return`<option value="${e(a)}" ${a==v?'selected':''}>${e(b)}</option>`}).join('')}</select>`;
const fl=(l,n,t='text',v='',r='required')=>`<label class="block text-sm">${l}<input name="${n}" type="${t}" value="${e(v)}" class="inp" ${r}></label>`;
const ta=(l,n,v='')=>`<label class="block text-sm">${l}<textarea name="${n}" rows="2" class="inp">${e(v)}</textarea></label>`;
const sw=()=>S.siswa.map(s=>[s.id,s.nama+' ('+s.kelas+')']);
const sf=s=>S.siswa.find(x=>x.id==s)||{nama:'(dihapus)',kelas:'-',nis:''};
const fm=f=>`onsubmit="event.preventDefault();${f}(Object.fromEntries(new FormData(this)))"`;
function modal(t,h){$('#mb').innerHTML=`<div class="flex justify-between mb-3"><h3 class="font-bold text-lg">${t}</h3><button onclick="closeM()" class="text-2xl leading-none">&times;</button></div>${h}`;$('#modal').classList.remove('hidden')}
const closeM=()=>$('#modal').classList.add('hidden');
const badge=s=>`<span class="px-2 py-0.5 rounded-full text-xs ${s=='Aman'||s=='Selesai'?'bg-emerald-100 text-emerald-700':s.startsWith('Pering')?'bg-amber-100 text-amber-700':'bg-rose-100 text-rose-700'}">${s}</span>`;
function st(id){const r={H:0,S:0,I:0,A:0,T:0,pel:0,pres:0,kon:S.konseling.filter(k=>k.sid==id&&k.jenis.startsWith('Konseling')).length};
S.absensi.filter(a=>a.sid==id).forEach(a=>r[{Hadir:'H',Sakit:'S',Izin:'I',Alfa:'A',Terlambat:'T'}[a.status]]++);
S.poin.filter(p=>p.sid==id).forEach(p=>{if(p.poin<0)r.pel-=p.poin;else r.pres+=p.poin});
r.skor=r.pres-r.pel;const n=r.pel-r.pres;r.status=n>=50?'Panggilan Orang Tua':n>=30?'Peringatan 2 (SP2)':n>=15?'Peringatan 1 (SP1)':'Aman';
const a=S.asesmen.filter(x=>x.sid==id).pop();r.as=a?a.gaya+' / '+a.minat:'-';return r}
const tbl=(h,rows)=>`<div class="overflow-x-auto"><table class="w-full"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="text-center text-slate-400">Belum ada data</td></tr>`}</tbody></table></div>`;
const del=(c,id)=>{if(!confirm('Hapus data ini?'))return;S[c]=S[c].filter(x=>x.id!=id);persist();go(cur);toast('Data berhasil dihapus')};
const NAV=[['dash','📊','Dashboard'],['siswa','👨‍🎓','Kelas & Siswa'],['abs','🗓️','Absensi'],['poin','⭐','Poin Perilaku'],['kons','💬','Konseling & Anekdot'],['ases','🧩','Asesmen'],['set','⚙️','Pengaturan & Ekspor']];
const V={};let cur='dash',ch=[];
function go(v){cur=v;$('#nav').innerHTML=NAV.map(n=>`<button onclick="go('${n[0]}');sb.classList.add('-translate-x-full')" class="w-full text-left px-3 py-2 rounded-lg ${n[0]==v?'bg-indigo-600':'hover:bg-indigo-800'}">${n[1]} ${n[2]}</button>`).join('');ch.forEach(c=>c.destroy());ch=[];$('#main').innerHTML=V[v]();window.scrollTo(0,0)}
/* DASHBOARD */
V.dash=()=>{const t=today(),ab=S.absensi.filter(a=>a.tgl==t),hd=ab.filter(a=>a.status=='Hadir'||a.status=='Terlambat').length;
const pm=S.poin.filter(p=>p.tgl.startsWith(t.slice(0,7))&&p.poin<0).reduce((s,p)=>s-p.poin,0);
const C=[['Total Siswa',S.siswa.length,'👨‍🎓'],['Total Kelas',S.kelas.length,'🏫'],['Kehadiran Hari Ini',ab.length?Math.round(hd/ab.length*100)+'%':'-','✅'],['Poin Pelanggaran Bulan Ini',pm,'⚠️'],['Kasus Aktif',S.konseling.filter(k=>k.status=='Proses').length,'📌']];
const att=S.siswa.map(s=>({s,x:st(s.id)})).filter(o=>o.x.pel-o.x.pres>=15||o.x.A>=2);setTimeout(charts,50);
return`<h1 class="text-2xl font-bold">Dashboard</h1><p class="text-sm text-slate-500 mb-4">Selamat datang, <b>${OWNER}</b> 👋 Aplikasi ini dibuat khusus untuk Anda.</p><div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">${C.map(c=>`<div class="card"><div class="text-2xl">${c[2]}</div><div class="text-2xl font-bold">${c[1]}</div><div class="text-xs text-slate-500">${c[0]}</div></div>`).join('')}</div>
<div class="grid lg:grid-cols-2 gap-4 mb-4"><div class="card"><b>Tren Pelanggaran & Prestasi (6 bulan)</b><canvas id="c1"></canvas></div><div class="card"><b>Kasus per Jenjang Kelas</b><canvas id="c2"></canvas></div></div>
<div class="card"><b>🚨 Siswa Perlu Perhatian Khusus</b>${tbl(['Nama','Kelas','Net Poin Pelanggaran','Alfa','Status'],att.map(o=>`<tr><td><a class="text-indigo-600 cursor-pointer" onclick="profil('${o.s.id}')">${e(o.s.nama)}</a></td><td>${o.s.kelas}</td><td>${o.x.pel-o.x.pres}</td><td>${o.x.A}</td><td class="whitespace-nowrap">${badge(o.x.status)} <button class="bg-emerald-600 hover:bg-emerald-700 text-white rounded px-2 py-0.5 text-xs" onclick="waOpen('${o.s.id}','panggil')">📲 Panggil Ortu</button></td></tr>`))}</div>`};
function charts(){if(cur!='dash'||!$('#c1'))return;const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(d.toISOString().slice(0,7))}
ch.push(new Chart($('#c1'),{type:'line',data:{labels:ms,datasets:[{label:'Pelanggaran',data:ms.map(m=>S.poin.filter(p=>p.tgl.startsWith(m)&&p.poin<0).length),borderColor:'#e11d48',tension:.3},{label:'Prestasi',data:ms.map(m=>S.poin.filter(p=>p.tgl.startsWith(m)&&p.poin>0).length),borderColor:'#059669',tension:.3}]}}));
const g=['7','8','9'];ch.push(new Chart($('#c2'),{type:'bar',data:{labels:g.map(x=>'Kelas '+x),datasets:[{label:'Pelanggaran',data:g.map(x=>S.poin.filter(p=>p.poin<0&&sf(p.sid).kelas[0]==x).length),backgroundColor:'#f43f5e'},{label:'Konseling/Anekdot',data:g.map(x=>S.konseling.filter(k=>sf(k.sid).kelas[0]==x).length),backgroundColor:'#6366f1'}]}}))}
/* SISWA */
let F={k:'',q:''};
V.siswa=()=>`<div class="flex flex-wrap gap-2 justify-between mb-4"><h1 class="text-2xl font-bold">Kelas & Siswa</h1><div class="flex gap-2"><button class="btn2" onclick="kelasM()">Kelola Kelas</button><button class="btn" onclick="sForm()">+ Siswa</button></div></div>
<div class="card"><div class="grid sm:grid-cols-2 gap-2 mb-3"><select class="inp" onchange="F.k=this.value;stb()"><option value="">Semua Kelas</option>${S.kelas.map(k=>`<option ${F.k==k?'selected':''}>${k}</option>`).join('')}</select><input class="inp" placeholder="Cari nama / NIS..." value="${e(F.q)}" oninput="F.q=this.value;stb()"></div><div id="stb">${stbH()}</div></div>`;
const stb=()=>$('#stb').innerHTML=stbH();
const stbH=()=>tbl(['NIS','Nama','Kelas','JK','Orang Tua','No. HP','Status','Aksi'],S.siswa.filter(s=>(!F.k||s.kelas==F.k)&&(s.nama+s.nis).toLowerCase().includes(F.q.toLowerCase())).map(s=>`<tr><td>${e(s.nis)}</td><td><a class="text-indigo-600 font-medium cursor-pointer" onclick="profil('${s.id}')">${e(s.nama)}</a></td><td>${s.kelas}</td><td>${s.jk}</td><td>${e(s.ortu)}</td><td>${e(s.hp)}</td><td>${badge(st(s.id).status)}</td><td class="whitespace-nowrap"><button title="WhatsApp Orang Tua" onclick="waOpen('${s.id}')">📲</button> <button onclick="sForm('${s.id}')">✏️</button> <button onclick="delS('${s.id}')">🗑️</button></td></tr>`));
function sForm(id){const s=S.siswa.find(x=>x.id==id)||{};modal(id?'Ubah Siswa':'Tambah Siswa',`<form ${fm('saveS')} class="grid sm:grid-cols-2 gap-3"><input type="hidden" name="id" value="${id||''}">${fl('NIS/NISN','nis','text',s.nis)}${fl('Nama Lengkap','nama','text',s.nama)}<label class="text-sm">Kelas${sel('kelas',S.kelas,s.kelas)}</label><label class="text-sm">Jenis Kelamin${sel('jk',[['L','Laki-laki'],['P','Perempuan']],s.jk)}</label>${fl('Orang Tua/Wali','ortu','text',s.ortu)}${fl('No. HP Orang Tua','hp','tel',s.hp)}<div class="sm:col-span-2">${ta('Status / Catatan Khusus','cat',s.cat)}</div><button class="btn sm:col-span-2">Simpan</button></form>`)}
function saveS(f){if(f.id){Object.assign(S.siswa.find(x=>x.id==f.id),f)}else{f.id=uid();S.siswa.push(f)}persist();closeM();go('siswa');toast('Data siswa berhasil disimpan')}
function delS(id){if(!confirm('Hapus siswa beserta seluruh rekam jejaknya?'))return;S.siswa=S.siswa.filter(s=>s.id!=id);['absensi','poin','konseling','asesmen'].forEach(c=>S[c]=S[c].filter(x=>x.sid!=id));persist();go('siswa');toast('Siswa dihapus')}
function kelasM(){modal('Kelola Kelas',`<div class="flex flex-wrap gap-2 mb-4">${S.kelas.map(k=>`<span class="bg-slate-100 rounded-full px-3 py-1 text-sm">${k} <button onclick="delK('${k}')">✕</button></span>`).join('')}</div><form ${fm('addK')} class="flex gap-2"><input name="k" class="inp" placeholder="Contoh: 7C (jenjang 7, 8, atau 9)" required pattern="[789][A-Za-z0-9]*"><button class="btn">Tambah</button></form>`)}
function addK(f){const k=f.k.toUpperCase();if(S.kelas.includes(k))return toast('Kelas sudah ada','err');S.kelas.push(k);S.kelas.sort();persist();kelasM();toast('Kelas ditambahkan')}
function delK(k){if(S.siswa.some(s=>s.kelas==k))return toast('Kelas masih memiliki siswa','err');S.kelas=S.kelas.filter(x=>x!=k);persist();kelasM();toast('Kelas dihapus')}
function profil(id){const s=sf(id),x=st(id),T=[];
S.absensi.filter(a=>a.sid==id&&a.status!='Hadir').forEach(a=>T.push([a.tgl,'🗓️','Absensi: '+a.status+(a.ket?' - '+a.ket:'')]));
S.poin.filter(p=>p.sid==id).forEach(p=>T.push([p.tgl,p.poin<0?'⚠️':'🏆',(p.poin<0?'Pelanggaran: ':'Prestasi: ')+p.kategori+' ('+(p.poin>0?'+':'')+p.poin+') - '+p.desc]));
S.konseling.filter(k=>k.sid==id).forEach(k=>T.push([k.tgl,'💬',k.jenis+': '+k.masalah+' → '+k.rtl+' ['+k.status+']']));
S.asesmen.filter(a=>a.sid==id).forEach(a=>T.push([a.tgl,'🧩','Asesmen: gaya belajar '+a.gaya+', minat '+a.minat]));
T.sort((a,b)=>b[0].localeCompare(a[0]));
modal('Profil 360° - '+e(s.nama),`<button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3 font-bold mb-3" onclick="waOpen('${id}')">📲 Hubungi / Panggil Orang Tua via WhatsApp</button><div class="text-sm mb-3">${s.nis} • Kelas ${s.kelas} • Ortu: ${e(s.ortu)} (${e(s.hp)})<br>${e(s.cat)}</div><div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center text-xs mb-3">${[['Hadir',x.H],['Sakit',x.S],['Izin',x.I],['Alfa',x.A],['Telat',x.T],['Skor',x.skor]].map(a=>`<div class="bg-slate-100 rounded-lg p-2"><b class="text-base">${a[1]}</b><br>${a[0]}</div>`).join('')}</div><div class="mb-3">Status: ${badge(x.status)} • Asesmen: ${x.as}</div><div class="max-h-80 overflow-y-auto space-y-2">${T.map(t=>`<div class="border-l-4 border-indigo-300 pl-3 text-sm"><span class="text-slate-400">${t[0]}</span> ${t[1]} ${e(t[2])}</div>`).join('')||'Belum ada rekam jejak'}</div>`)}
/* ABSENSI */
let AB={k:'',t:today(),f:ago(30),u:today()};
V.abs=()=>{if(!AB.k)AB.k=S.kelas[0];const ss=S.siswa.filter(s=>s.kelas==AB.k),ex=id=>S.absensi.find(a=>a.sid==id&&a.tgl==AB.t)||{};
const R=S.siswa.filter(s=>s.kelas==AB.k).map(s=>{const x=st2(s.id);return`<tr><td>${e(s.nama)}</td><td>${x.H}</td><td>${x.S}</td><td>${x.I}</td><td>${x.A}</td><td>${x.T}</td><td><b>${x.n?Math.round((x.H+x.T)/x.n*100)+'%':'-'}</b></td></tr>`});
return`<h1 class="text-2xl font-bold mb-4">Absensi & Rekap Kehadiran</h1><div class="card mb-4"><div class="grid sm:grid-cols-2 gap-2 mb-3"><label class="text-sm">Kelas<select class="inp" onchange="AB.k=this.value;go('abs')">${S.kelas.map(k=>`<option ${AB.k==k?'selected':''}>${k}</option>`).join('')}</select></label><label class="text-sm">Tanggal<input type="date" class="inp" value="${AB.t}" onchange="AB.t=this.value;go('abs')"></label></div>
<form ${fm('saveAbs')}>${tbl(['Siswa','Status','Keterangan'],ss.map(s=>`<tr><td>${e(s.nama)}</td><td>${sel('st_'+s.id,['Hadir','Sakit','Izin','Alfa','Terlambat'],ex(s.id).status||'Hadir')}</td><td><input name="ket_${s.id}" class="inp" value="${e(ex(s.id).ket||'')}"></td></tr>`))}<button class="btn mt-3">Simpan Absensi</button></form></div>
<div class="card"><b>Rekap Kehadiran Kelas ${AB.k}</b><div class="grid grid-cols-2 gap-2 my-2"><label class="text-sm">Dari<input type="date" class="inp" value="${AB.f}" onchange="AB.f=this.value;go('abs')"></label><label class="text-sm">Sampai<input type="date" class="inp" value="${AB.u}" onchange="AB.u=this.value;go('abs')"></label></div>${tbl(['Siswa','H','S','I','A','T','% Hadir'],R)}</div>`};
function st2(id){const r={H:0,S:0,I:0,A:0,T:0,n:0};S.absensi.filter(a=>a.sid==id&&a.tgl>=AB.f&&a.tgl<=AB.u).forEach(a=>{r[{Hadir:'H',Sakit:'S',Izin:'I',Alfa:'A',Terlambat:'T'}[a.status]]++;r.n++});return r}
function saveAbs(f){S.siswa.filter(s=>s.kelas==AB.k).forEach(s=>{S.absensi=S.absensi.filter(a=>!(a.sid==s.id&&a.tgl==AB.t));S.absensi.push({id:uid(),sid:s.id,tgl:AB.t,status:f['st_'+s.id],ket:f['ket_'+s.id]})});persist();go('abs');toast('Absensi berhasil disimpan')}
/* POIN */
V.poin=()=>`<h1 class="text-2xl font-bold mb-4">Poin Perilaku</h1><div class="grid lg:grid-cols-2 gap-4 mb-4"><div class="card"><b>Input Kejadian</b><form ${fm('addPoin')} class="space-y-2 mt-2"><label class="text-sm">Siswa${sel('sid',sw())}</label>${fl('Tanggal','tgl','date',today())}<label class="text-sm">Kategori Aturan${sel('aid',S.aturan.map(a=>[a.id,a.nama+' ('+(a.poin>0?'+':'')+a.poin+')']))}</label>${ta('Deskripsi Kejadian','desc')}${ta('Tindak Lanjut','tl')}<button class="btn">Simpan</button></form></div>
<div class="card"><b>Master Aturan Poin</b>${tbl(['Aturan','Poin',''],S.aturan.map(a=>`<tr><td>${e(a.nama)}</td><td>${a.poin}</td><td><button onclick="del('aturan','${a.id}')">🗑️</button></td></tr>`))}<form ${fm('addAt')} class="flex gap-2 mt-2"><input name="nama" class="inp" placeholder="Nama aturan" required><input name="poin" type="number" class="inp w-24" placeholder="±poin" required><button class="btn">+</button></form><p class="text-xs text-slate-500 mt-2">Status otomatis (poin pelanggaran bersih): ≥15 SP1, ≥30 SP2, ≥50 Panggilan Orang Tua.</p></div></div>
<div class="card"><b>Log Kejadian</b>${tbl(['Tanggal','Siswa','Kategori','Poin','Deskripsi','Tindak Lanjut',''],[...S.poin].sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(p=>`<tr><td>${p.tgl}</td><td>${e(sf(p.sid).nama)}</td><td>${e(p.kategori)}</td><td class="${p.poin<0?'text-rose-600':'text-emerald-600'} font-bold">${p.poin}</td><td>${e(p.desc)}</td><td>${e(p.tl)}</td><td class="whitespace-nowrap"><button class="bg-emerald-600 hover:bg-emerald-700 text-white rounded px-2 py-0.5 text-xs" onclick="waOpen('${p.sid}','','${p.id}')">📲 Info Ortu</button> <button onclick="del('poin','${p.id}')">🗑️</button></td></tr>`))}</div>`;
function addPoin(f){const a=S.aturan.find(x=>x.id==f.aid);S.poin.push({id:uid(),...f,kategori:a.nama,poin:a.poin});persist();go('poin');toast('Kejadian berhasil disimpan')}
function addAt(f){S.aturan.push({id:uid(),nama:f.nama,poin:+f.poin});persist();go('poin');toast('Aturan ditambahkan')}
/* KONSELING */
V.kons=()=>`<h1 class="text-2xl font-bold mb-4">Anekdot, Konseling & Home Visit</h1><div class="card mb-4"><form ${fm('addK2')} class="grid sm:grid-cols-2 gap-3"><label class="text-sm">Siswa${sel('sid',sw())}</label>${fl('Tanggal','tgl','date',today())}<label class="text-sm">Jenis Layanan${sel('jenis',['Catatan Anekdot','Konseling Individu','Konseling Kelompok','Konseling Karir','Konseling Belajar','Home Visit'])}</label><label class="text-sm">Status${sel('status',['Proses','Selesai'])}</label>${ta('Permasalahan / Deskripsi Perilaku','masalah')}${ta('Analisis / Hasil Pertemuan','hasil')}<div class="sm:col-span-2">${ta('Rencana Tindak Lanjut (RTL)','rtl')}</div><button class="btn sm:col-span-2">Simpan Catatan</button></form></div>
<div class="card">${tbl(['Tanggal','Siswa','Kelas','Jenis','Masalah','Hasil','RTL','Status',''],[...S.konseling].sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(k=>`<tr><td>${k.tgl}</td><td>${e(sf(k.sid).nama)}</td><td>${sf(k.sid).kelas}</td><td>${k.jenis}</td><td>${e(k.masalah)}</td><td>${e(k.hasil)}</td><td>${e(k.rtl)}</td><td><button onclick="tg('${k.id}')">${badge(k.status)}</button></td><td><button onclick="del('konseling','${k.id}')">🗑️</button></td></tr>`))}</div>`;
function addK2(f){S.konseling.push({id:uid(),...f});persist();go('kons');toast('Catatan berhasil disimpan')}
function tg(id){const k=S.konseling.find(x=>x.id==id);k.status=k.status=='Proses'?'Selesai':'Proses';persist();go('kons');toast('Status diperbarui')}
/* ASESMEN */
const REK={Visual:'gunakan peta pikiran, warna, dan diagram',Auditori:'gunakan diskusi, rekaman, dan membaca bersuara',Kinestetik:'gunakan praktik langsung dan belajar sambil bergerak','Akademik':'ikut olimpiade/klub belajar','Seni/Musikal':'ikut ekstrakurikuler seni/musik','Olahraga':'ikut tim olahraga sekolah','Sosial/Interpersonal':'ikut OSIS/organisasi/tutor sebaya','Teknologi':'ikut klub komputer/robotik'};
V.ases=()=>`<h1 class="text-2xl font-bold mb-4">Asesmen Bakat, Minat & Gaya Belajar</h1><div class="card mb-4"><form ${fm('addAs')} class="grid sm:grid-cols-2 gap-3"><label class="text-sm">Siswa${sel('sid',sw())}</label>${fl('Tanggal','tgl','date',today())}<label class="text-sm">Gaya Belajar${sel('gaya',['Visual','Auditori','Kinestetik'])}</label><label class="text-sm">Minat Dominan${sel('minat',['Akademik','Seni/Musikal','Olahraga','Sosial/Interpersonal','Teknologi'])}</label><button class="btn sm:col-span-2">Simpan Asesmen</button></form></div><div class="card">${tbl(['Tanggal','Siswa','Gaya Belajar','Minat','Rekomendasi',''],S.asesmen.map(a=>`<tr><td>${a.tgl}</td><td>${e(sf(a.sid).nama)}</td><td>${a.gaya}</td><td>${a.minat}</td><td>Belajar: ${REK[a.gaya]}. Pengembangan diri: ${REK[a.minat]}.</td><td><button onclick="del('asesmen','${a.id}')">🗑️</button></td></tr>`))}</div>`;
function addAs(f){S.asesmen.push({id:uid(),...f});persist();go('ases');toast('Asesmen berhasil disimpan')}
/* PENGATURAN & EKSPOR */
V.set=()=>`<h1 class="text-2xl font-bold mb-4">Pengaturan & Ekspor</h1><div class="grid lg:grid-cols-2 gap-4"><div class="card space-y-2"><b>📗 Ekspor Laporan Excel</b><label class="text-sm block">Filter Kelas<select id="exk" class="inp"><option value="">Semua Kelas</option>${S.kelas.map(k=>`<option>${k}</option>`).join('')}</select></label><button class="btn" onclick="exportX()">Export Laporan Lengkap ke Excel (.xlsx)</button></div>
<div class="card space-y-2"><b>💾 Backup Database (JSON)</b><button class="btn" onclick="bk()">Export Backup JSON</button><label class="block text-sm">Import Backup<input type="file" accept=".json" class="inp" onchange="imp(this)"></label></div>
<div class="card"><b>🏫 Identitas Sekolah & Guru BK</b><form ${fm('saveCfg')} class="space-y-2 mt-2">${fl('Nama Sekolah','sekolah','text',cfg().sekolah)}${fl('Nama Guru BK','guru','text',cfg().guru)}<button class="btn">Simpan Identitas</button><p class="text-xs text-slate-500">Dipakai pada tanda tangan pesan WhatsApp.</p></form></div><div class="card space-y-2"><b>🔄 Data</b><button class="btn2" onclick="rs(1)">Reset Data Contoh</button> <button class="btn2 !bg-rose-100 !text-rose-700" onclick="rs(0)">Kosongkan Semua Data</button></div></div>`;
function exportX(){const kl=$('#exk').value,ss=S.siswa.filter(s=>!kl||s.kelas==kl),ids=new Set(ss.map(s=>s.id)),wb=XLSX.utils.book_new(),add=(r,n,w)=>{const x=XLSX.utils.json_to_sheet(r);x['!cols']=w.map(c=>({wch:c}));XLSX.utils.book_append_sheet(wb,x,n)};
add(ss.map(s=>{const x=st(s.id);return{NIS:s.nis,'Nama Lengkap':s.nama,Kelas:s.kelas,'Jenis Kelamin':s.jk,Hadir:x.H,Sakit:x.S,Izin:x.I,Alfa:x.A,Terlambat:x.T,'Total Poin Pelanggaran':x.pel,'Total Poin Prestasi':x.pres,'Skor Akhir':x.skor,'Status Pembinaan':x.status,'Jumlah Sesi Konseling':x.kon,'Gaya Belajar/Minat':x.as}}),'Rekap Track Record',[10,26,8,8,8,8,8,8,10,14,14,10,22,12,28]);
add(S.absensi.filter(a=>ids.has(a.sid)).sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(a=>({Tanggal:a.tgl,Kelas:sf(a.sid).kelas,'Nama Siswa':sf(a.sid).nama,Status:a.status,Keterangan:a.ket})),'Log Absensi',[12,8,26,12,30]);
add(S.poin.filter(p=>ids.has(p.sid)).map(p=>({Tanggal:p.tgl,Kelas:sf(p.sid).kelas,'Nama Siswa':sf(p.sid).nama,Jenis:p.poin<0?'Pelanggaran':'Prestasi','Kategori Aturan':p.kategori,Poin:p.poin,Deskripsi:p.desc,'Tindak Lanjut':p.tl})),'Log Pelanggaran & Prestasi',[12,8,26,12,28,8,36,28]);
add(S.konseling.filter(k=>ids.has(k.sid)).map(k=>({Tanggal:k.tgl,Kelas:sf(k.sid).kelas,'Nama Siswa':sf(k.sid).nama,'Jenis Layanan':k.jenis,'Uraian Masalah':k.masalah,Hasil:k.hasil,'Tindak Lanjut':k.rtl,Status:k.status})),'Jurnal Konseling & Anekdot',[12,8,26,20,36,36,30,10]);
XLSX.writeFile(wb,'Laporan_SiBK_SMP_'+(kl||'Semua')+'_'+today()+'.xlsx');toast('Laporan Excel berhasil diekspor')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='backup-sibk-'+today()+'.json';a.click();toast('Backup JSON berhasil diunduh')}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.siswa||!d.kelas)throw 0;S=d;persist();go('set');toast('Backup berhasil diimpor')}catch(x){toast('File backup tidak valid','err')}};if(i.files[0])r.readAsText(i.files[0])}
function rs(m){if(!confirm(m?'Kembalikan ke data contoh? Data saat ini akan hilang.':'Kosongkan SEMUA data? Tindakan ini tidak dapat dibatalkan.'))return;S=m?seed():{kelas:[],siswa:[],absensi:[],aturan:seed().aturan,poin:[],konseling:[],asesmen:[]};persist();go('dash');toast(m?'Data contoh dipulihkan':'Semua data dikosongkan')}
function tUpd(){const d=document.documentElement.classList.contains('dark'),b=$('#tbtn');if(b)b.textContent=d?'☀️ Mode Terang':'🌙 Mode Malam';document.querySelectorAll('.tbtn2').forEach(x=>x.textContent=d?'☀️':'🌙');if(window.Chart){Chart.defaults.color=d?'#cbd5e1':'#475569';Chart.defaults.borderColor=d?'#334155':'#e2e8f0'}}
function tema(){const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('sibk_theme',d?'dark':'light')}catch(x){}tUpd();go(cur);toast(d?'Mode malam diaktifkan':'Mode terang diaktifkan')}
/* WHATSAPP */
function cfg(){return S.cfg||(S.cfg={sekolah:'SMP ........................',guru:'Anedebora'})}
function saveCfg(f){S.cfg={sekolah:f.sekolah.trim(),guru:f.guru.trim()||'Anedebora'};persist();toast('Identitas sekolah & guru BK berhasil disimpan')}
function waNo(h){let n=String(h||'').replace(/\D/g,'');if(!n)return'';if(n.startsWith('620'))n='62'+n.slice(3);else if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return/^628\d{7,11}$/.test(n)?n:''}
let W={};
function waOpen(sid,tpl,pid){const s=sf(sid);if(!waNo(s.hp))return toast(String(s.hp||'').trim()?'Nomor WhatsApp orang tua tidak valid':'Nomor WhatsApp orang tua belum diisi','err');
const x=st(sid),p=pid&&S.poin.find(q=>q.id==pid);W={sid,pid:p?p.id:''};tpl=tpl||(p?(p.poin<0?'harian':'apresiasi'):x.status!='Aman'?'panggil':'harian');const c=cfg();
const T=[['panggil','1. Surat Panggilan Orang Tua (SP1 / SP2 / Panggilan Resmi)'],['harian','2. Pemberitahuan Kejadian / Pelanggaran Harian'],['absen','3. Pemberitahuan Ketidakhadiran (Alfa / Terlambat)'],['apresiasi','4. Apresiasi Prestasi / Perilaku Positif']];
modal('📲 Pratinjau Pesan WhatsApp',`<div class="space-y-3 text-sm"><div class="grid grid-cols-2 gap-2"><div>Siswa<div class="font-bold">${e(s.nama)}</div></div><div>Kelas<div class="font-bold">${s.kelas}</div></div></div>
<div class="grid sm:grid-cols-2 gap-2"><label>Orang Tua/Wali<input id="wa_ortu" class="inp" value="${e(s.ortu)}" oninput="waGen()"></label><label>Nomor WhatsApp<input id="wa_hp" class="inp" value="${e(s.hp)}"></label></div>
<label class="block">Template Pesan${sel('wa_t_',T,tpl,'id="wa_t" onchange="waGen()"')}</label>
<div id="wa_j" class="grid sm:grid-cols-2 gap-2 bg-slate-100 rounded-xl p-3"><label>Tanggal Pertemuan<input id="wa_tg" type="date" class="inp" value="${ago(-3)}" oninput="waGen()"></label><label>Jam<input id="wa_jm" class="inp" value="09.00 WIB" oninput="waGen()"></label><label>Tempat<input id="wa_tp" class="inp" value="Ruang Bimbingan Konseling" oninput="waGen()"></label><label>Nama Sekolah<input id="wa_sk" class="inp" value="${e(c.sekolah)}" oninput="waGen()"></label></div>
<label class="block">Isi Pesan (bebas diedit)<textarea id="wa_msg" rows="14" class="inp text-xs"></textarea></label><p class="text-xs text-slate-500">Mengubah template/jadwal akan menyusun ulang isi pesan.</p>
<label class="flex gap-2 items-center"><input id="wa_log" type="checkbox" checked> Otomatis catat riwayat panggilan ini ke Jurnal Konseling / RTL</label>
<button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3 font-bold" onclick="waKirim()">Kirim Sekarang via WhatsApp</button></div>`);waGen()}
function waGen(){const s=sf(W.sid),x=st(W.sid),c=cfg(),g=i=>$('#'+i).value,t=g('wa_t'),sk=g('wa_sk')||c.sekolah;$('#wa_j').style.display=t=='panggil'?'':'none';
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'-';
const lp=f=>S.poin.filter(p=>p.sid==W.sid&&f(p)).sort((a,b)=>b.tgl.localeCompare(a.tgl))[0],pv=W.pid&&S.poin.find(q=>q.id==W.pid);let ti,b;
if(t=='panggil'){const l=lp(q=>q.poin<0);ti='SURAT PANGGILAN ORANG TUA';b=`Melalui pesan ini, Bimbingan Konseling ${sk} mengundang Bapak/Ibu untuk hadir dalam pertemuan terkait pembinaan putra/putri Bapak/Ibu.\n\n*Rincian Pembinaan*\n• Akumulasi poin pelanggaran: *${x.pel}*\n• Poin prestasi: ${x.pres}\n• Status pembinaan: *${x.status}*\n• Catatan pelanggaran terakhir: ${l?l.kategori+' ('+l.tgl+')'+(l.desc?' - '+l.desc:''):'-'}\n\n*Jadwal Pertemuan*\n• Hari/Tanggal: ${fd(g('wa_tg'))}\n• Pukul: ${g('wa_jm')}\n• Tempat: ${g('wa_tp')}\n\nMohon kehadiran Bapak/Ibu tepat waktu. Apabila berhalangan, mohon konfirmasi kepada kami.`}
else if(t=='harian'){const q=pv&&pv.poin<0?pv:lp(r=>r.poin<0);ti='PEMBERITAHUAN KEJADIAN';b=q?`Kami menginformasikan kejadian berikut yang melibatkan putra/putri Bapak/Ibu:\n\n• Tanggal: ${q.tgl}\n• Kejadian: *${q.kategori}* (${q.poin} poin)\n• Keterangan: ${q.desc||'-'}\n• Tindak lanjut: ${q.tl||'-'}\n\nTotal akumulasi poin pelanggaran saat ini: *${x.pel}* (status: ${x.status}). Mohon Bapak/Ibu turut membimbing putra/putri di rumah.`:'Belum ada kejadian pelanggaran yang tercatat.'}
else if(t=='absen'){ti='PEMBERITAHUAN KETIDAKHADIRAN';b=`Kami menginformasikan rekap kehadiran putra/putri Bapak/Ibu:\n\n• Alfa (tanpa keterangan): *${x.A}* hari\n• Terlambat: *${x.T}* kali\n• Sakit / Izin: ${x.S} / ${x.I} hari\n\nMohon Bapak/Ibu membantu memastikan putra/putri hadir tepat waktu dan memberi keterangan bila berhalangan.`}
else{const q=pv&&pv.poin>0?pv:lp(r=>r.poin>0);ti='APRESIASI PRESTASI SISWA';b=q?`Kami dengan bangga menyampaikan kabar baik tentang putra/putri Bapak/Ibu:\n\n• Capaian: *${q.kategori}* (+${q.poin} poin)\n• Tanggal: ${q.tgl}\n• Keterangan: ${q.desc||'-'}\n• Total poin prestasi: *${x.pres}*\n\nTerima kasih atas dukungan Bapak/Ibu. Mari terus kita dukung agar semakin berkembang.`:'Belum ada catatan prestasi.'}
$('#wa_msg').value=`*${ti}*\n\nYth. Bapak/Ibu *${g('wa_ortu')}*\nOrang tua/wali dari *${s.nama}* (Kelas ${s.kelas})\n\n${b}\n\nTerima kasih atas perhatian dan kerja samanya.\n\nHormat kami,\n*${c.guru}*\nGuru Bimbingan Konseling\n${sk}`}
function waKirim(){const n=waNo($('#wa_hp').value),m=$('#wa_msg').value.trim();if(!n)return toast('Nomor WhatsApp orang tua belum diisi','err');if(!m)return toast('Isi pesan masih kosong','err');
window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank');
if($('#wa_log').checked){const t=$('#wa_t'),lb=t.options[t.selectedIndex].text.replace(/^\d\.\s*/,''),pj=t.value=='panggil';S.konseling.push({id:uid(),sid:W.sid,tgl:today(),jenis:'Catatan Anekdot',masalah:'Komunikasi WhatsApp ke orang tua: '+lb,hasil:'Pesan dikirim ke '+$('#wa_ortu').value+' ('+n+')',rtl:pj?'Menunggu kehadiran/konfirmasi orang tua pada '+$('#wa_tg').value+' pukul '+$('#wa_jm').value:'Pantau perkembangan siswa',status:pj?'Proses':'Selesai'});persist()}
closeM();go(cur);toast('WhatsApp dibuka'+($('#wa_log')?'':''))}
tUpd();go('dash');
</script></body></html>
